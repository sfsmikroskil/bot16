name: Bot Baru

on:
  # Memungkinkan bot dijalankan manual dari tombol di GitHub
  workflow_dispatch:
  
  # Jalankan otomatis sesuai jadwal (contoh: Setiap jam 08:00 WIB / 01:00 UTC)
  #schedule:
  #  - cron: '0 1 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-ind

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytesseract pillow

      - name: Verify Installation
        run: |
          tesseract --version
          python -c "import pytesseract; import PIL; print('OK')"

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Jalankan Bot Python
        run: python bot.py
# LANGKAH UNTUK MENYIMPAN PREVIEW SCREENSHOT
      - name: Simpan Preview Screenshot
        if: always() # Tetap simpan foto meskipun skrip error di tengah jalan
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: "*.png"
